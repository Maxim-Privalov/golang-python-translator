      #     echo "Найден исполняемый файл: $exePath"
          
      #     # Запускаем в фоне и перенаправляем потоки вывода в файлы (чтобы шаг не завис)
      #     $process = Start-Process -FilePath $exePath -WindowStyle Hidden -PassThru -RedirectStandardOutput "app_stdout.log" -RedirectStandardError "app_stderr.log"
          
      #     # Сохраняем PID процесса в переменную окружения GitHub для следующих шагов
      #     echo "APP_PID=$($process.Id)" >> $env.GITHUB_ENV
      #     echo "Приложение запущено с PID: $($process.Id)"
          
      #     # Даем приложению 5 секунд на запуск перед началом тестов
      #     Start-Sleep -Seconds 5

      # # Шаг 3: Гарантированная остановка приложения (Вызовется ВСЕГДА)
      # - name: Stop Application
      #   if: always() # Этот флаг обязателен! Шаг сработает, даже если тесты упали с ошибкой
