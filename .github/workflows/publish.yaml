      #         # Принудительно завершаем процесс дерева
      #         Stop-Process -Id ${{ env.APP_PID }} -Force
      #         echo "Процесс успешно остановлен."
      #     } else {
      #         echo "Процесс не найден. Возможно, он уже закрылся сам или упал во время тестов."
      #     }

      #     # (Опционально) Выводим логи дебага в консоль GitHub Actions
      #     echo "--- Стандартный вывод приложения (stdout) ---"
      #     if (Test-Path "app_stdout.log") { Get-Content "app_stdout.log" -ErrorAction SilentlyContinue }

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe